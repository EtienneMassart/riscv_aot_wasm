<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="415" viewBox="0 0 1160 415">
  <rect width="1160" height="415" fill="white"/>
  <style>
    .cell { stroke: #333; stroke-width: 1.2; }
    .label { font-family: Times New Roman, serif; font-size: 16px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .small { font-family: Times New Roman, serif; font-size: 14px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .axis { font-family: Times New Roman, serif; font-size: 15px; fill: #111; text-anchor: end; dominant-baseline: middle; }
    .legend { font-family: Times New Roman, serif; font-size: 14px; fill: #111; dominant-baseline: middle; }
  </style>

  <text class="axis" x="70" y="86">GP</text>
  <g transform="translate(90,50)">
