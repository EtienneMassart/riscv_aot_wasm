    <text class="small" x="976.5" y="55">x31</text>
  </g>

  <text class="axis" x="70" y="220">FP</text>
  <g transform="translate(90,184)">
    <rect class="cell" x="0" y="0" width="496" height="110" fill="#cfe1f5"/>
    <text class="label" x="248" y="36">locals + scratch</text>
    <text class="label" x="248" y="72">f0-f15</text>
