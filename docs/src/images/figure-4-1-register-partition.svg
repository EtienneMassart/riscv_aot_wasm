    <text class="small" x="77.5" y="55">sp</text>
    <rect class="cell" x="93" y="0" width="31" height="110" fill="#f0b07a"/>
    <text class="small" x="108.5" y="55">fp</text>
    <rect class="cell" x="124" y="0" width="31" height="110" fill="#f0b07a"/>
    <text class="small" x="139.5" y="55">gb</text>
