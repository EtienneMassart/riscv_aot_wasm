    <text class="small" x="201.5" y="55">sb</text>
    <rect class="cell" x="217" y="0" width="31" height="110" fill="#f0b07a"/>
    <text class="small" x="232.5" y="55">tb</text>
    <rect class="cell" x="248" y="0" width="372" height="110" fill="#cfe1f5"/>
    <text class="label" x="434" y="36">locals + scratch</text>
    <text class="label" x="434" y="72">x8-x19</text>
    <rect class="cell" x="620" y="0" width="217" height="110" fill="#8cbbe6"/>
    <text class="label" x="728.5" y="42">scratch only</text>
    <text class="label" x="728.5" y="72">x20-x26</text>
