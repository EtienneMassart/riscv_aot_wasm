<svg xmlns="http://www.w3.org/2000/svg" width="910" height="630" viewBox="0 0 910 630">
  <rect width="910" height="630" fill="white"/>
  <style>
    .box { stroke: #444; stroke-width: 1.6; }
    .label { font-family: Times New Roman, serif; font-size: 16px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .side { font-family: Times New Roman, serif; font-size: 15px; fill: #111; dominant-baseline: middle; }
    .small { font-family: Times New Roman, serif; font-size: 14px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
  </style>

  <text x="455" y="25" text-anchor="middle" font-family="Times New Roman, serif" font-size="16" font-style="italic" fill="#222">4 Porting to RISC-V</text>
  <line x1="12" y1="38" x2="898" y2="38" stroke="#444" stroke-width="1.2"/>

  <rect class="box" x="308" y="64" width="194" height="58" fill="#e9e9e9"/>
  <text class="label" x="405" y="93">caller's own frame</text>

  <rect class="box" x="308" y="122" width="194" height="68" fill="#d3e4f4"/>
  <text class="label" x="405" y="147">parameters</text>
  <text class="label" x="405" y="168">(positive offsets)</text>

  <rect class="box" x="308" y="190" width="194" height="36" fill="#f6d3bd"/>
  <text class="label" x="405" y="208">return address (fp − 4)</text>

  <rect class="box" x="308" y="226" width="194" height="98" fill="#dce9f5"/>
  <text class="label" x="405" y="259">locals’ backup slots</text>
  <text class="label" x="405" y="281">(negative offsets)</text>

  <rect class="box" x="308" y="324" width="194" height="96" fill="#84b2de"/>
  <text class="label" x="405" y="356">scratch spills,</text>
  <text class="label" x="405" y="378">resolved values</text>
  <text class="label" x="405" y="400">(grows as needed)</text>

  <line x1="268" y1="120" x2="268" y2="432" stroke="#9a9a9a" stroke-width="1.2"/>
  <polygon points="268,432 262,421 274,421" fill="#9a9a9a"/>
  <text transform="translate(245,280) rotate(-90)" class="small" fill="#9a9a9a">addresses decrease</text>

  <line x1="528" y1="152" x2="507" y2="152" stroke="#e6762c" stroke-width="1.4"/>
  <polygon points="507,152 516,147 516,157" fill="#e6762c"/>
  <text class="side" x="540" y="152">fp (= sp at entry)</text>

  <line x1="528" y1="340" x2="507" y2="340" stroke="#e6762c" stroke-width="1.4"/>
  <polygon points="507,340 516,335 516,345" fill="#e6762c"/>
  <text class="side" x="540" y="335">sp, stack_base</text>
  <text class="side" x="540" y="354">(after prologue)</text>
</svg>